<meta charset="utf-8">
<title>雨夜の街角</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
  /* 单一夜景：全屏三维微缩模型，没有任何界面元素 */
  :root { --night: #0b0c20; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--night); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  #stage canvas:active { cursor: grabbing; }
</style>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/OutlineEffect.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(() => {
'use strict';
const JP = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
const stage = document.getElementById('stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 700;
const PR = Math.min(window.devicePixelRatio || 1, small ? 1.5 : 2);

// ================= 渲染器 =================
// 后处理渲染目标只有 16 位深度：用对数深度，避免描边外壳与薄板地面互相穿插
const renderer = new THREE.WebGLRenderer({ antialias: false, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // 场景静止，阴影只烘焙一次
stage.appendChild(renderer.domElement);
const HDR = renderer.capabilities.isWebGL2 && renderer.extensions.has('EXT_color_buffer_float');
const K = (k) => (HDR ? k : Math.min(k, 1));

const scene = new THREE.Scene();
const FOG_C = new THREE.Color(0x15173a);
scene.fog = new THREE.Fog(FOG_C, 40, 90);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.5, 300);
camera.layers.enable(1);
const TARGET = new THREE.Vector3(-0.4, 1.3, 0.3);
// 默认机位压低拉近：湿路面倒影更强，屋顶衬在雨幕前
const VIEW = { az: 22, el: 17 };

function fitDistance(aspect) {
  const t = Math.tan(THREE.MathUtils.degToRad(16));
  return Math.max(21.5 / (2 * t), (aspect < 1 ? 26 : 29.5) / (2 * t * aspect));
}
function placeCamera() {
  const d = fitDistance(innerWidth / innerHeight);
  const az = THREE.MathUtils.degToRad(VIEW.az), el = THREE.MathUtils.degToRad(VIEW.el);
  camera.position.set(
    TARGET.x + d * Math.cos(el) * Math.sin(az),
    TARGET.y + d * Math.sin(el),
    TARGET.z + d * Math.cos(el) * Math.cos(az)
  );
  camera.lookAt(TARGET);
}
placeCamera();

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.screenSpacePanning = true;
controls.minDistance = 8;
controls.maxDistance = Math.max(95, fitDistance(innerWidth / innerHeight) * 1.6);
controls.maxPolarAngle = Math.PI * 0.46;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.9;
controls.autoRotate = !reduceMotion && !/shot/.test(location.search);
controls.autoRotateSpeed = 0.25;
let idleTimer = 0, userMoved = false;
controls.addEventListener('start', () => { userMoved = true; controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', () => {
  clearTimeout(idleTimer);
  if (!reduceMotion) idleTimer = setTimeout(() => { controls.autoRotate = true; }, 8000);
});
// 平移不允许把视点拖出底座
controls.addEventListener('change', () => {
  const t = controls.target;
  const cx = THREE.MathUtils.clamp(t.x, -8, 8), cy = THREE.MathUtils.clamp(t.y, 0, 5), cz = THREE.MathUtils.clamp(t.z, -8, 8);
  if (cx !== t.x || cy !== t.y || cz !== t.z) {
    camera.position.x += cx - t.x; camera.position.y += cy - t.y; camera.position.z += cz - t.z;
    t.set(cx, cy, cz);
  }
});
if (/shot/.test(location.search)) window.__dio = { camera, controls, scene, renderer };

// ================= 材质工具 =================
// 三色卡通色阶：暗部低饱和的深灰紫，亮部微暖；饱和度只留给光源
const grad = (() => {
  const d = new Uint8Array([28, 26, 46, 255, 128, 124, 158, 255, 255, 248, 240, 255]);
  const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();
const tcache = {};
function T(color, extra) {
  if (!extra) {
    if (!tcache[color]) tcache[color] = new THREE.MeshToonMaterial({ color, gradientMap: grad });
    return tcache[color];
  }
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: grad }, extra));
}
function noOL(m) { m.userData.outlineParameters = { visible: false }; return m; }
// 自发光材质：k>1 时进入泛光
function E(map, k, extra) {
  return new THREE.MeshBasicMaterial(Object.assign({ map, color: new THREE.Color(K(k), K(k), K(k)) }, extra || {}));
}
function EC(color, k, extra) {
  return new THREE.MeshBasicMaterial(Object.assign({ color: new THREE.Color(color).multiplyScalar(K(k)) }, extra || {}));
}
function ct(w, h, fn, rep) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  fn(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function repTex(src, rx, ry) {
  const t = src.clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  return t;
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function star(g, cx, cy, R, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
    g.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  g.closePath();
}
// 固定种子的伪随机：每次打开都是同一个模型
let seed = 20261103;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// ================= 几何工具 =================
// 倒角盒：边缘的圆角会接住一条细高光，是微缩模型质感的来源。
// r128 的 RoundedBoxGeometry 在平面区域 UV 会塌缩，这里按每个面平面投影重写 UV。
function roundedBox(w, h, d, r) {
  const g = new THREE.RoundedBoxGeometry(w, h, d, 1, r);
  const pos = g.attributes.position, uv = g.attributes.uv;
  const per = pos.count / 6;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const side = Math.floor(i / per);
    let u, v;
    if (side === 0) { u = (d / 2 - z) / d; v = (y + h / 2) / h; }
    else if (side === 1) { u = (z + d / 2) / d; v = (y + h / 2) / h; }
    else if (side === 2) { u = (x + w / 2) / w; v = (d / 2 - z) / d; }
    else if (side === 3) { u = (x + w / 2) / w; v = (z + d / 2) / d; }
    else if (side === 4) { u = (x + w / 2) / w; v = (y + h / 2) / h; }
    else { u = (w / 2 - x) / w; v = (y + h / 2) / h; }
    uv.setXY(i, u, v);
  }
  return g;
}
function B(w, h, d, mat, x, y, z, p) {
  const mn = Math.min(w, h, d), mid = w + h + d - mn - Math.max(w, h, d);
  const geo = (mn >= 0.18 && mid >= 0.5) ? roundedBox(w, h, d, Math.min(0.06, Math.max(0.025, mn * 0.15))) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y + h / 2, z);
  (p || scene).add(m);
  return m;
}
function Cy(rt, rb, h, mat, x, y, z, p, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 14), mat);
  m.position.set(x, y + h / 2, z);
  (p || scene).add(m);
  return m;
}
function Sp(r, mat, x, y, z, p, ws, hs) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, ws || 16, hs || 12), mat);
  m.position.set(x, y, z);
  (p || scene).add(m);
  return m;
}
function grp(x, y, z, ry, p) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry || 0;
  (p || scene).add(g);
  return g;
}
const UP = new THREE.Vector3(0, 1, 0);
function rod(a, b, r, mat, p, seg) {
  const A = new THREE.Vector3().fromArray(a), Bv = new THREE.Vector3().fromArray(b);
  const d = Bv.clone().sub(A), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg || 8), mat);
  m.position.copy(A).add(Bv).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  (p || scene).add(m);
  return m;
}
function flat(w, d, mat, x, y, z, ry, p) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.order = 'YXZ';
  m.rotation.x = -Math.PI / 2;
  m.rotation.y = ry || 0;
  m.position.set(x, y, z);
  (p || scene).add(m);
  return m;
}
function plane(w, h, mat, x, y, z, ry, p) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry || 0;
  (p || scene).add(m);
  return m;
}
// 背靠背两张单面板：两侧文字都不会镜像
function twoFace(w, h, front, back, x, y, z, ry, p) {
  const g = grp(x, y, z, ry, p);
  plane(w, h, front, 0, 0, 0.003, 0, g);
  plane(w, h, back, 0, 0, -0.003, Math.PI, g);
  return g;
}
function faces(front, back, side) { return [side, side, side, side, front, back || side]; }

// 特效对象登记
const outlineHide = []; // Sprite / Line / Points：描边二次绘制时隐藏
const reflHide = [];    // 地面贴花、积水、雨：不进入镜像渲染
const noShadow = new Set();
const flick = [];       // 路灯闪烁时一起变化的材质

const glowTex = ct(128, 128, (g) => {
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.22, 'rgba(255,255,255,0.5)');
  r.addColorStop(0.55, 'rgba(255,255,255,0.12)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
});
function glow(color, size, x, y, z, op, sy) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: op == null ? 0.6 : op, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  s.scale.set(size, sy || size, 1);
  s.position.set(x, y, z);
  scene.add(s);
  outlineHide.push(s);
  return s;
}
function floorGlow(color, w, d, x, y, z, op, ry, tex) {
  const m = flat(w, d, noOL(new THREE.MeshBasicMaterial({ map: tex || glowTex, color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })), x, y, z, ry);
  m.renderOrder = 2; // 叠在积水之上，光池不会被水面盖掉
  reflHide.push(m); noShadow.add(m);
  return m;
}
// 接触阴影：物体脚下的柔和暗斑，让东西"坐"在地上
const aoTex = ct(128, 128, (g) => {
  const r = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  r.addColorStop(0, 'rgba(6,4,18,0.85)'); r.addColorStop(0.5, 'rgba(6,4,18,0.45)'); r.addColorStop(1, 'rgba(6,4,18,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
});
const aoMat = noOL(new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, depthWrite: false, opacity: 0.7 }));
function ao(w, d, x, y, z, ry) {
  const m = flat(w, d, aoMat, x, y + 0.008, z, ry);
  reflHide.push(m); noShadow.add(m);
  return m;
}

// ================= 背景 =================
scene.background = ct(512, 512, (g, w, h) => {
  const lg = g.createLinearGradient(0, 0, 0, h);
  lg.addColorStop(0, '#07081a'); lg.addColorStop(0.5, '#111433'); lg.addColorStop(1, '#191433');
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  const rg = g.createRadialGradient(w * 0.5, h * 0.46, 10, w * 0.5, h * 0.5, w * 0.62);
  rg.addColorStop(0, 'rgba(60,72,150,0.30)'); rg.addColorStop(1, 'rgba(60,72,150,0)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
});

// ================= 环境光：一盏塑形主光 + 弱环境 + 背缘光 =================
// 主光从左上偏前方打来：屋顶亮、正面中间调、右侧面暗，默认视角下三个面三个明度
scene.add(new THREE.HemisphereLight(0x34416c, 0x2a2230, 0.32));
const moon = new THREE.DirectionalLight(0xa3abd0, 0.72);
moon.position.set(-11, 19, 5);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 60 });
moon.shadow.bias = -0.0006;
moon.shadow.normalBias = 0.03;
moon.shadow.radius = 3;
scene.add(moon);
const rimL = new THREE.DirectionalLight(0x6f5cff, 0.28);
rimL.position.set(-6, 9, -16);
scene.add(rimL);

// ================= 地面高度（给雨用） =================
function groundAt(x, z) {
  if (x < -11 || x > 11 || z < -11 || z > 11) return -9;
  if (x > -5.42 && x < 2.62 && z > -7.02 && z < -1.0) return 4.16;   // 便利店屋顶
  if (x > -5.55 && x < 2.75 && z >= -1.0 && z < 0.27) return 2.72;    // 雨棚
  if (x < -7.2 && z > -10.0 && z < -1.2) return 7.95;                 // 邻楼屋顶
  if (x < -7.2 && z >= -1.2 && z < -0.25) return 2.83;                // 喫茶店檐
  if (z > 4.9 && z < 6.5 && x < 5.2) return 0.16;                     // 人行道
  if (x > 4.9 && x < 6.5 && z < 5.2) return 0.16;
  if (x >= 5.2 && z >= 5.2) { const dx = x - 5.2, dz = z - 5.2; return dx * dx + dz * dz < 1.69 ? 0.16 : 0.02; }
  if (x <= 4.9 && z <= 4.9) return 0.1;                               // 地块
  return 0.02;                                                        // 车道
}

function build() {
  // ================= 底座：胡桃木倒角 + 黄铜铭牌 =================
  const woodTex = ct(512, 128, (g, w, h) => {
    g.fillStyle = '#4a2a1d'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 80; i++) {
      const y = rnd() * h;
      g.strokeStyle = `rgba(${rnd() > 0.5 ? '125,74,46' : '28,14,9'},${0.12 + rnd() * 0.25})`;
      g.lineWidth = 0.6 + rnd() * 1.6;
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.02 + i) * 2.4 + (rnd() - 0.5) * 1.4);
      g.stroke();
    }
    // 木头的上亮下暗：像展示架顶灯打下来
    const fg = g.createLinearGradient(0, 0, 0, h);
    fg.addColorStop(0, 'rgba(255,220,180,0.16)'); fg.addColorStop(0.5, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,0,0,0.32)');
    g.fillStyle = fg; g.fillRect(0, 0, w, h);
  });
  const sq = (half) => half * Math.SQRT2;
  function frustum(hTop, hBot, height, mat, yTop) {
    // 非索引几何体 + 重算法线 = 每个斜面都是硬边平面
    const geo = new THREE.CylinderGeometry(sq(hTop), sq(hBot), height, 4, 1).toNonIndexed();
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat);
    m.rotation.y = Math.PI / 4;
    m.position.y = yTop - height / 2;
    scene.add(m);
    return m;
  }
  frustum(11.0, 11.32, 0.3, T(0x8c5838), -0.02);
  B(22.64, 1.3, 22.64, T(0xffffff, { map: woodTex }), 0, -1.62, 0);
  frustum(11.32, 11.12, 0.18, T(0x3a2218), -1.62);
  B(22.0, 0.08, 22.0, T(0x120d18), 0, -1.88, 0);
  const plateTex = ct(1024, 112, (g, w, h) => {
    const lg = g.createLinearGradient(0, 0, 0, h);
    lg.addColorStop(0, '#d8b673'); lg.addColorStop(0.5, '#ae8848'); lg.addColorStop(1, '#8a6a34');
    g.fillStyle = lg; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(60,40,10,0.6)'; g.lineWidth = 4; g.strokeRect(10, 10, w - 20, h - 20);
    g.fillStyle = '#3a270d'; g.textAlign = 'center';
    g.font = `900 46px ${JP}`; g.fillText('雨夜のコンビニ　星見町三丁目', w / 2, 62);
    g.font = `800 20px ${JP}`; g.fillText('RAINY NIGHT  ·  HOSHIMI-CHO 3-CHOME  ·  1 : 48', w / 2, 94);
  });
  B(5.7, 0.64, 0.05, T(0x6a4a22), 0, -1.29, 11.335);
  plane(5.5, 0.54, E(plateTex, 0.95), 0, -0.97, 11.365);
  // 桌面上的柔和投影
  const shTex = ct(256, 256, (g, w, h) => {
    const r = g.createRadialGradient(128, 128, 30, 128, 128, 128);
    r.addColorStop(0, 'rgba(3,3,10,0.85)'); r.addColorStop(0.55, 'rgba(3,3,10,0.45)'); r.addColorStop(1, 'rgba(3,3,10,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  });
  const sh = flat(44, 44, noOL(new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false, fog: false })), 0, -1.93, 0);
  sh.renderOrder = -1; noShadow.add(sh); reflHide.push(sh);
  // 展示台面：深色木纹，向四周淡出到背景里
  const tableTex = ct(512, 512, (g, w, h) => {
    g.fillStyle = '#1d1722'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) {
      g.strokeStyle = `rgba(${rnd() > 0.5 ? '60,42,40' : '10,8,14'},${0.03 + rnd() * 0.04})`; g.lineWidth = 2 + rnd() * 4;
      const y = rnd() * h; g.beginPath(); g.moveTo(0, y);
      g.bezierCurveTo(w * 0.3, y + rnd() * 10 - 5, w * 0.6, y + rnd() * 10 - 5, w, y + rnd() * 8 - 4); g.stroke();
    }
    const r = g.createRadialGradient(256, 256, 90, 256, 256, 256);
    r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(0.62, 'rgba(0,0,0,0.75)'); r.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'destination-in'; g.fillStyle = r; g.fillRect(0, 0, w, h);
  });
  const table = flat(70, 70, noOL(new THREE.MeshBasicMaterial({ map: tableTex, transparent: true, depthWrite: false, fog: false })), 0, -1.95, 0);
  table.renderOrder = -2; noShadow.add(table); reflHide.push(table);

function mergeStatic() {
  if (!THREE.BufferGeometryUtils) return;
  scene.updateMatrixWorld(true);
  const buckets = new Map();
  const _s = new THREE.Vector3();
  scene.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh || Array.isArray(o.material)) return;
    const m = o.material;
    if (m.transparent || m.isShaderMaterial || !m.visible) return;
    const g = o.geometry;
    if (!g.attributes.normal || !g.attributes.uv) return;
    // 不发光的小道具只放在第 1 层：主相机看得到，镜像相机（只看第 0 层）跳过
    g.computeBoundingSphere();
    _s.setFromMatrixScale(o.matrixWorld);
    const small = !o.userData.keep && !m.isMeshBasicMaterial && g.boundingSphere.radius * Math.max(_s.x, _s.y, _s.z) < 0.45;
    const key = m.uuid + (noShadow.has(o) ? '|n' : '') + (g.index ? '|i' : '|f') + (small ? '|s' : '');
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(o);

  for (const [key, list] of buckets) {
    if (list.length < 2) { if (key.includes('|s')) list[0].layers.set(1); continue; }
    const geos = list.map((o) => {
      const g = o.geometry.clone();
      for (const name of Object.keys(g.attributes)) if (name !== 'position' && name !== 'normal' && name !== 'uv') g.deleteAttribute(name);
      g.morphAttributes = {};
      g.clearGroups();
      g.applyMatrix4(o.matrixWorld);
      return g;
    });
    const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(geos, false);
    if (!merged) continue;
    const mesh = new THREE.Mesh(merged, list[0].material);
    if (key.includes('|n')) noShadow.add(mesh);
    if (key.includes('|s')) mesh.layers.set(1);
    scene.add(mesh);
    for (const o of list) o.parent.remove(o);
  }
}

    uniform sampler2D map; varying vec3 vColor;
    void main(){
      #include <logdepthbuf_fragment>
      float a = texture2D(map, vec2(gl_PointCoord.x, 1.0 - gl_PointCoord.y)).a;
      gl_FragColor = vec4(vColor * a, 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const splashes = new THREE.Points(splGeo, splMat);
splashes.frustumCulled = false;
scene.add(splashes);
outlineHide.push(splashes); reflHide.push(splashes);
function emitSplash(x, y, z) {
  const i = splI++ % SPL_N;
  splT[i] = 0; splLife[i] = 0.18 + rnd() * 0.1; splS[i] = 0.15 + rnd() * 0.1;
  splPos[i * 3] = x; splPos[i * 3 + 2] = z; splY[i] = y;
  const c = lightAt(x, y + 0.4, z, [0.14, 0.17, 0.3], 1.6);
  splBase[i * 3] = c[0]; splBase[i * 3 + 1] = c[1]; splBase[i * 3 + 2] = c[2];
}
// 积水涟漪：实例化圆环，一次绘制
const RIP_N = 70;
const ripGeo = new THREE.RingGeometry(0.8, 1, 28);
ripGeo.rotateX(-Math.PI / 2);
const ripples = new THREE.InstancedMesh(ripGeo, noOL(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })), RIP_N);
ripples.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
ripples.frustumCulled = false;
const ripState = [];
const _m4 = new THREE.Matrix4(), _col = new THREE.Color();
for (let i = 0; i < RIP_N; i++) {
  ripState.push({ t: 9, life: 1, x: 0, y: 0, z: 0, s0: 0, s1: 0, c: [0, 0, 0] });
  _m4.makeScale(0, 0, 0); ripples.setMatrixAt(i, _m4); ripples.setColorAt(i, _col.setRGB(0, 0, 0));
}
scene.add(ripples);
reflHide.push(ripples); noShadow.add(ripples);
let ripI = 0;

function updateRain(dt) {
  const base = [0.08, 0.1, 0.18];
  for (let i = 0; i < RAIN_N; i++) {
    const d = drops[i];
    const o = i * 6;
    if (d.wait > 0) { d.wait -= dt; rainPos.fill(0, o, o + 6); rainCol.fill(0, o, o + 6); continue; }
    if (d.drip) { d.v += 9.8 * dt; d.y -= d.v * dt; }
    else { const k = SPEED * d.v * dt; d.x += DIR.x * k; d.y += DIR.y * k; d.z += DIR.z * k; }
    if (d.y <= d.g) {
      if (rnd() < (d.drip ? 0.8 : 0.32)) emitSplash(d.lx, d.g, d.lz);
      spawnDrop(d, false);
    }
    const L = d.len;
    rainPos[o] = d.x; rainPos[o + 1] = d.y; rainPos[o + 2] = d.z;
    if (d.drip) { rainPos[o + 3] = d.x; rainPos[o + 4] = d.y + L; rainPos[o + 5] = d.z; }
    else { rainPos[o + 3] = d.x - DIR.x * L; rainPos[o + 4] = d.y - DIR.y * L; rainPos[o + 5] = d.z - DIR.z * L; }
    const c = lightAt(d.x, d.y, d.z, base, 2.2);
    const fade = Math.min(1, Math.max(0, (10.6 - d.y) / 1.8));
    rainCol[o] = c[0] * fade; rainCol[o + 1] = c[1] * fade; rainCol[o + 2] = c[2] * fade;
    rainCol[o + 3] = c[0] * fade * 0.12; rainCol[o + 4] = c[1] * fade * 0.12; rainCol[o + 5] = c[2] * fade * 0.16;
  }
  rainGeo.attributes.position.needsUpdate = true;
  rainGeo.attributes.color.needsUpdate = true;
  // 水花
  for (let i = 0; i < SPL_N; i++) {
    if (splT[i] >= splLife[i]) { splSize[i] = 0; continue; }
    splT[i] += dt;
    const k = Math.min(splT[i] / splLife[i], 1);
    const s = splS[i] * (0.45 + 0.55 * Math.sqrt(k));
    splSize[i] = s;
    splPos[i * 3 + 1] = splY[i] + s * 0.3;
    const f = (1 - k) * (1 - k);
    splCol[i * 3] = splBase[i * 3] * f; splCol[i * 3 + 1] = splBase[i * 3 + 1] * f; splCol[i * 3 + 2] = splBase[i * 3 + 2] * f;
  }
  splGeo.attributes.position.needsUpdate = true;
  splGeo.attributes.aColor.needsUpdate = true;
  splGeo.attributes.aSize.needsUpdate = true;
  // 涟漪
  let want = dt * 32;
  while (want > 0) {
    if (want < 1 && rnd() > want) break;
    want -= 1;
    const p = puddles[Math.floor(rnd() * puddles.length)];
    const a = rnd() * Math.PI * 2, r2 = Math.sqrt(rnd()) * 0.75;
    const st = ripState[ripI++ % RIP_N];
    st.t = 0; st.life = 0.8 + rnd() * 0.3; st.x = p.x + Math.cos(a) * p.rx * r2; st.y = p.y + 0.003; st.z = p.z + Math.sin(a) * p.rz * r2;
    st.s0 = 0.03; st.s1 = 0.2 + rnd() * 0.12;
    const c = lightAt(st.x, 0.6, st.z, [0.16, 0.19, 0.32], 1.4);
    st.c[0] = c[0]; st.c[1] = c[1]; st.c[2] = c[2];
  }
  for (let i = 0; i < RIP_N; i++) {
    const st = ripState[i];
    if (st.t >= st.life) { if (st.t < 8) { st.t = 9; _m4.makeScale(0, 0, 0); ripples.setMatrixAt(i, _m4); } continue; }
    st.t += dt;
    const k = Math.min(st.t / st.life, 1);
    const s = st.s0 + (st.s1 - st.s0) * (1 - (1 - k) * (1 - k));
    _m4.makeScale(s, s, s); _m4.setPosition(st.x, st.y, st.z);
    ripples.setMatrixAt(i, _m4);
    const f = Math.pow(1 - k, 1.5) * 0.6;
    ripples.setColorAt(i, _col.setRGB(st.c[0] * f, st.c[1] * f, st.c[2] * f));
  }
  ripples.instanceMatrix.needsUpdate = true;
  if (ripples.instanceColor) ripples.instanceColor.needsUpdate = true;
}

// ================= 合成：主渲染 + 描边 + 泛光 + 调色 =================
let composer, bloom;
const GradeShader = {
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; varying vec2 vUv;
    vec3 shoulder(vec3 c){ vec3 x = max(c - 0.75, 0.0); return min(c, 0.75) + 0.25 * (1.0 - exp(-x / 0.25)); }
    void main(){
      vec3 src = max(texture2D(tDiffuse, vUv).rgb, 0.0);
      float L0 = dot(src, vec3(0.2126, 0.7152, 0.0722));
      // 只提暗部，不压平亮面之间的明度差
      vec3 c = shoulder(mix(pow(src, vec3(0.9)), src, smoothstep(0.15, 0.3, L0)));
      float L = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= mix(vec3(0.96, 0.97, 1.04), vec3(1.04, 1.0, 0.95), smoothstep(0.12, 0.7, L));
      c += vec3(0.008, 0.009, 0.018) * (1.0 - smoothstep(0.0, 0.25, L));
      c = mix(vec3(L), c, mix(0.85, 1.1, smoothstep(0.3, 0.7, L)));
      vec2 d = vUv - 0.5; c *= 1.0 - dot(d, d) * 0.35;
      c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`,
};
function makeComposer() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const type = HDR ? THREE.HalfFloatType : THREE.UnsignedByteType;
  let rt;
  if (renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget) {
    rt = new THREE.WebGLMultisampleRenderTarget(size.x, size.y, { format: THREE.RGBAFormat, type });
    rt.samples = small ? 2 : 4;
  } else {
    rt = new THREE.WebGLRenderTarget(size.x, size.y, { format: THREE.RGBAFormat, type, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  }
  composer = new THREE.EffectComposer(renderer, rt);
  composer.setPixelRatio(PR);
  composer.setSize(innerWidth, innerHeight);
  const effect = new THREE.OutlineEffect(renderer, { defaultThickness: 0.0034, defaultColor: [0.05, 0.04, 0.12], defaultAlpha: 1, defaultKeepAlive: true });
  composer.addPass({
    enabled: true, needsSwap: false, clear: false, renderToScreen: false,
    setSize() {},
    render(r, writeBuffer, readBuffer) {
      r.setRenderTarget(this.renderToScreen ? null : readBuffer);
      r.clear();
      r.render(scene, camera);
      for (const o of outlineHide) o.visible = false;
      effect.renderOutline(scene, camera);
      for (const o of outlineHide) o.visible = true;
    },
  });
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.4, HDR ? 1.0 : 0.9);
  composer.addPass(bloom);
  composer.addPass(new THREE.ShaderPass(GradeShader));
}

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  if (!userMoved) { placeCamera(); controls.target.copy(TARGET); }
  controls.maxDistance = Math.max(95, fitDistance(w / h) * 1.6);
  reflRT.setSize(Math.max(256, Math.floor(w * PR * 0.45)), Math.max(256, Math.floor(h * PR * 0.45)));
  splMat.uniforms.uScale.value = (h * PR) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}

// ================= 启动 =================
const fontReady = (document.fonts && document.fonts.load)
  ? Promise.race([
      Promise.all([document.fonts.load(`900 40px "M PLUS Rounded 1c"`), document.fonts.load(`800 20px "M PLUS Rounded 1c"`)]),
      new Promise((r) => setTimeout(r, 2500)),
    ]).catch(() => {})
  : Promise.resolve();

fontReady.then(() => {
  const fx = build();
  mergeStatic();
  scene.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const skip = noShadow.has(o) || o.isInstancedMesh || mats.some((m) => m.transparent || m.isShaderMaterial);
    o.castShadow = !skip;
    o.receiveShadow = !skip;
  });
  renderer.shadowMap.needsUpdate = true;
  makeComposer();
  resize();
  addEventListener('resize', resize);
  const clock = new THREE.Clock();
  let flickerT = 0;
  const _d = new THREE.Vector3();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    controls.update();
    // 雾随观看距离移动，远端始终有一层雨雾
    const dist = _d.copy(camera.position).sub(controls.target).length();
    scene.fog.near = dist - 6; scene.fog.far = dist + 46;
    updateRain(dt);
    waterUniforms.time.value = t;
    fx.lanternLight.intensity = 1.05 + Math.sin(t * 2.1) * 0.1 + Math.sin(t * 7.3) * 0.04;
    fx.lanternGlow.material.opacity = 0.42 + Math.sin(t * 2.1) * 0.05;
    flickerT -= dt;
    let k = 1;
    if (flickerT < 0) { if (rnd() < 0.0012) flickerT = 0.4; } // 平均十几秒闪一次
    else k = Math.sin(t * 55) > 0.15 ? 1 : 0.3;
    fx.lampSpot.intensity = 4.2 * k;
    fx.lampGlow.material.opacity = 0.85 * k;
    fx.lampCore.material.opacity = 0.9 * k;
    rainLights[1].s = k;
    waterUniforms.lampK.value = k;
    fx.lampPool.material.opacity = 0.5 * k;
    fx.coneM.opacity = 0.2 * k;
    for (const f of flick) f.m.color.copy(f.base).multiplyScalar(k);
    // 首帧先走主相机渲染：静态阴影要用能看到全部图层的相机来烘焙
    if (!first) updateReflection();
    composer.render(dt);
    first = false;
    requestAnimationFrame(frame);
  }
  let first = true;
  frame();
});
})();
</script>
